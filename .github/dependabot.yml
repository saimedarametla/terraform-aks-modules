version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /modules/*
      - /examples/*
    schedule:
      interval: weekly
    ignore:
      - dependency-name: hashicorp/azurerm
        update-types: ["version-update:semver-major"]
